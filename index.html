<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product mangemnt</title>
    <!-- link css -->
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crud">
        <div class="head">
            <h1>Dashboard Control</h1>
            <p class="typewriter">product managemt system</p>
        </div>


        <div class="inputs">
            <input type="text" id="title" placeholder="title">
            <div class="price">
            <input onkeyup="getTotal()" type="number" id="price" placeholder="price">
            <input onkeyup="getTotal()" type="number" id="taxes" placeholder="taxes">
            <input onkeyup="getTotal()" type="number" id="ads" placeholder="ads">
            <input onkeyup="getTotal()" type="number" id="discount" placeholder="discount">
            <small id="total"></small>
            </div>
            <input type="number" id="count" placeholder="count">
            <input type="text" id="category" placeholder="category">
            <button id="submit">Create</button>

        </div>



        <div class="outputs">
           <div class="search">
            <input onkeyup=" searchData(this.value)" type="text" id="search" placeholder="search">
            <div class="btn-search">
                <button onclick=" getSearchMood(this.id)" id="searchTitle">Search By Title</button>
                <button onclick=" getSearchMood(this.id)" id="searchCategory">Search By Cataigory</button>
            </div>
           </div>
           <div id="deleteAll">

           </div>
           <table>
            <thead>
            <tr>
                <th>id</th>
                <th>title</th>
                <th>price</th>
                <th>taxes</th>
                <th>ads</th>
                <th>discount</th>
                <th>total</th>
                <th>category</th>
                <th>Update</th>
                <th>Delete</th>
            </tr>
            </thead>


            <tbody id="tbody">



            </tbody>

           </table>
        </div>
    </div>


                <footer>

           <div class="footer-content">

            <p>Development By <span>
            <a href="https://www.facebook.com/share/18T1cHcedp/" target="_blank">AMGAD THABET</a></span></p>

           </div>

        </footer>








    <script src="main.js"></script>
</body>
</html>
